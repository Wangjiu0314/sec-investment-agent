<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; letter-spacing: 0; }
      .title { font-size: 38px; font-weight: 700; fill: #172126; }
      .subtitle { font-size: 18px; fill: #5c6a70; }
      .layer { font-size: 23px; font-weight: 700; fill: #172126; }
      .body { font-size: 16px; fill: #425158; }
      .small { font-size: 14px; fill: #65747a; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7b8a90"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#f4f7f7"/>
  <rect x="0" y="0" width="1600" height="12" fill="#ca7a28"/>
  <text x="72" y="72" class="title">模型会犯错：如何把 LLM 输出变成可交付研究结果</text>
  <text x="72" y="108" class="subtitle">不是依赖一个更长 Prompt，而是建立逐层收紧的工程护栏</text>

  <rect x="72" y="168" width="280" height="590" rx="8" fill="#172126"/>
  <text x="100" y="213" class="layer white">不可信输入</text>
  <text x="100" y="255" class="body white">SEC HTML</text>
  <text x="100" y="287" class="body white">DeepSeek JSON</text>
  <text x="100" y="319" class="body white">模型摘要与判断</text>
  <line x1="100" y1="350" x2="324" y2="350" stroke="#506067"/>
  <text x="100" y="392" class="small white">可能出现</text>
  <text x="100" y="430" class="body white">字段缺失</text>
  <text x="100" y="462" class="body white">虚构数字</text>
  <text x="100" y="494" class="body white">错误期间或单位</text>
  <text x="100" y="526" class="body white">目录误判为正文</text>
  <text x="100" y="558" class="body white">把潜在风险写成已发生</text>
  <rect x="100" y="620" width="224" height="88" rx="6" fill="#2d3b41"/>
  <text x="120" y="655" class="small white">原则</text>
  <text x="120" y="686" class="body white">模型只提出候选结论</text>

  <line x1="352" y1="463" x2="402" y2="463" stroke="#7b8a90" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="416" y="168" width="758" height="590" rx="8" fill="#ffffff" stroke="#d7e0e2"/>
  <text x="448" y="213" class="layer">五层确定性验证</text>

  <rect x="448" y="244" width="694" height="78" rx="6" fill="#edf3f6" stroke="#c8dbe5"/>
  <rect x="466" y="260" width="46" height="46" rx="6" fill="#3178a5"/>
  <text x="489" y="290" text-anchor="middle" class="white" font-size="17" font-weight="700">01</text>
  <text x="532" y="274" class="layer" font-size="19">Schema</text>
  <text x="532" y="301" class="body">Pydantic 固定字段、枚举、范围；兼容模型常见 JSON 变体</text>

  <rect x="448" y="338" width="694" height="78" rx="6" fill="#e8f2ef" stroke="#b9d8cf"/>
  <rect x="466" y="354" width="46" height="46" rx="6" fill="#13715b"/>
  <text x="489" y="384" text-anchor="middle" class="white" font-size="17" font-weight="700">02</text>
  <text x="532" y="368" class="layer" font-size="19">Boundary</text>
  <text x="532" y="395" class="body">block ID 必须存在；标题顺序、层级、正文长度由 Python验证</text>

  <rect x="448" y="432" width="694" height="78" rx="6" fill="#fff7e8" stroke="#ead0a5"/>
  <rect x="466" y="448" width="46" height="46" rx="6" fill="#ca7a28"/>
  <text x="489" y="478" text-anchor="middle" class="white" font-size="17" font-weight="700">03</text>
  <text x="532" y="462" class="layer" font-size="19">Evidence</text>
  <text x="532" y="489" class="body">每个事实绑定 evidence ID，并回到 SEC 原文 source_start/source_end</text>

  <rect x="448" y="526" width="694" height="78" rx="6" fill="#fbeeee" stroke="#e6c0c0"/>
  <rect x="466" y="542" width="46" height="46" rx="6" fill="#a64949"/>
  <text x="489" y="572" text-anchor="middle" class="white" font-size="17" font-weight="700">04</text>
  <text x="532" y="556" class="layer" font-size="19">Financial</text>
  <text x="532" y="583" class="body">数值完整匹配；期间语义统一；million/billion 可逆换算</text>

  <rect x="448" y="620" width="694" height="106" rx="6" fill="#f7f9f9" stroke="#d7e0e2"/>
  <rect x="466" y="650" width="46" height="46" rx="6" fill="#64747b"/>
  <text x="489" y="680" text-anchor="middle" class="white" font-size="17" font-weight="700">05</text>
  <text x="532" y="650" class="layer" font-size="19">Review + Cache</text>
  <text x="532" y="678" class="body">Reduce 后逐条语义审查；失败留 diagnostics；通过结果断点缓存</text>
  <text x="532" y="704" class="small">重试只处理失败任务，不重新消耗全部 API</text>

  <line x1="1174" y1="463" x2="1224" y2="463" stroke="#7b8a90" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1238" y="168" width="290" height="590" rx="8" fill="#ffffff" stroke="#b9d8cf" stroke-width="2"/>
  <text x="1268" y="213" class="layer">可信输出</text>
  <rect x="1268" y="246" width="230" height="104" rx="6" fill="#e8f2ef" stroke="#b9d8cf"/>
  <text x="1290" y="282" class="body">有来源的事实</text>
  <text x="1290" y="314" class="body">有边界的章节</text>
  <text x="1290" y="338" class="small">可点击回到原文</text>
  <rect x="1268" y="370" width="230" height="104" rx="6" fill="#edf3f6" stroke="#c8dbe5"/>
  <text x="1290" y="406" class="body">有状态的风险</text>
  <text x="1290" y="438" class="body">有单位的数字</text>
  <text x="1290" y="462" class="small">不把 may 写成已发生</text>
  <rect x="1268" y="494" width="230" height="104" rx="6" fill="#fff7e8" stroke="#ead0a5"/>
  <text x="1290" y="530" class="body">可恢复的任务</text>
  <text x="1290" y="562" class="body">可解释的失败</text>
  <text x="1290" y="586" class="small">没有“后台仍在运行”假象</text>
  <rect x="1268" y="620" width="230" height="106" rx="6" fill="#172126"/>
  <text x="1290" y="658" class="white" font-size="18" font-weight="700">最终研究备忘录</text>
  <text x="1290" y="691" class="small white">仅保留通过验证的结论</text>

  <text x="72" y="830" class="body">设计原则：</text>
  <text x="180" y="830" class="layer" font-size="21">不要求模型永不犯错，而是让错误可被检测、定位和恢复。</text>
</svg>
